[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abalar"
version = "0.1.0"
description = "Cliente non oficial para abalarMóbil (Xunta de Galicia)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cryptography>=42",
]

[project.scripts]
abalar = "abalar.cli:main"
